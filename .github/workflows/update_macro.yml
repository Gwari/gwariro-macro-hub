name: Weekly Macro Hub Auto-Update

on:
  schedule:
    - cron: '0 8 * * SAT' # Runs every Saturday at 08:00 UTC
  workflow_dispatch: # Allows manual triggers from GitHub

# Grant explicit write permissions so the bot can push changes back
permissions:
  contents: write

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas yfinance requests

      - name: Run macro data engine and build HTML
        run: |
          python build_macro_dashboard.py

      - name: Commit and push updated HTML back to repo
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Macro_Dashboard.html
          git diff --staged --quiet || git commit -m "Automated weekend macro update: $(date +'%Y-%m-%d')"
          git push origin HEAD